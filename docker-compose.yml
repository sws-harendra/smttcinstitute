services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smttc_laravel_app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:80"
      - "3000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-smttc_db}
      DB_USERNAME: ${MYSQL_USER:-dbuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dbpassword}
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: smttc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smttc_db}
      MYSQL_USER: ${MYSQL_USER:-dbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbpassword}
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: smttc_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
