services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: smttc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smttc_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Maps your local 'database' folder to MySQL's initialization directory
      # Any .sql files put in the database folder will be executed when the container starts for the first time
      - ./database:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    container_name: smttc_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
